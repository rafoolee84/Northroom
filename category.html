<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Northroom — Category</title>
  <meta name="description" content="Quiet home goods by category." />
  <link rel="preconnect" href="https://smart-store-service.onrender.com" />
  <style>
    :root {
      --cream: #f4efe6;
      --paper: #fffcf7;
      --ink: #2a2724;
      --muted: #7a7268;
      --line: #e5ddd1;
      --btn: #2a2724;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Georgia, "Iowan Old Style", "Times New Roman", serif;
      background: var(--cream);
      color: var(--ink);
      line-height: 1.5;
    }
    a { color: inherit; text-decoration: none; }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 6vw;
      border-bottom: 1px solid var(--line);
      background: rgba(244,239,230,0.92);
      position: sticky;
      top: 0;
      z-index: 5;
      backdrop-filter: blur(8px);
      gap: 16px;
      flex-wrap: wrap;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      letter-spacing: 0.24em;
      font-size: 13px;
      font-weight: 600;
    }
    .brand svg { width: 28px; height: 24px; }
    nav {
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 4px 14px;
      justify-content: flex-end;
    }
    nav a { color: var(--muted); }
    nav a:hover { color: var(--ink); }
    .hero {
      padding: 64px 6vw 28px;
      max-width: 720px;
    }
    .hero p.eyebrow {
      margin: 0 0 12px;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: 12px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .hero h1 {
      margin: 0;
      font-size: clamp(34px, 6vw, 52px);
      font-weight: 500;
      line-height: 1.15;
      letter-spacing: -0.01em;
    }
    .hero .lede {
      margin: 18px 0 0;
      font-size: 18px;
      color: var(--muted);
      max-width: 34em;
    }
    .section-head {
      padding: 36px 6vw 8px;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
    }
    .section-head h2 {
      margin: 0;
      font-size: 22px;
      font-weight: 500;
    }
    .section-head span {
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: 12px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .cat-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 16px;
      padding: 12px 6vw 40px;
    }
    .cat-card {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 22px 22px 20px;
      display: flex;
      flex-direction: column;
      min-height: 140px;
      transition: border-color 0.15s ease, transform 0.15s ease;
    }
    .cat-card:hover {
      border-color: #d2c6b4;
      transform: translateY(-1px);
    }
    .cat-card .count {
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 10px;
    }
    .cat-card h3 {
      margin: 0 0 8px;
      font-size: 22px;
      font-weight: 500;
    }
    .cat-card p {
      margin: 0;
      color: var(--muted);
      font-size: 15px;
      flex: 1;
    }
    .cat-card .go {
      margin-top: 16px;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: 12px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--ink);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 18px;
      padding: 12px 6vw 48px;
    }
    .card {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .thumb {
      aspect-ratio: 4 / 3;
      background: linear-gradient(145deg, #efe7da, #e2d7c7);
      display: flex;
      align-items: flex-end;
      justify-content: flex-start;
      padding: 14px;
      position: relative;
      overflow: hidden;
    }
    .thumb img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .thumb .cat { position: relative; z-index: 1; }
    .cat {
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      background: rgba(255,252,247,0.85);
      padding: 6px 10px;
      border-radius: 999px;
    }
    .body { padding: 18px 18px 20px; display: flex; flex-direction: column; flex: 1; }
    .body h3 { margin: 0 0 6px; font-size: 18px; font-weight: 500; }
    .price {
      margin: 0 0 10px;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: 14px;
      color: var(--muted);
    }
    .body p {
      margin: 0 0 16px;
      color: var(--muted);
      font-size: 15px;
      flex: 1;
    }
    button.buy {
      appearance: none;
      border: 0;
      background: var(--btn);
      color: var(--cream);
      padding: 11px 14px;
      border-radius: 999px;
      font-size: 13px;
      letter-spacing: 0.06em;
      cursor: pointer;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    }
    button.buy:disabled { opacity: 0.55; cursor: wait; }
    .note {
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: 12px;
      color: #9a5b45;
      margin: 8px 0 0;
      min-height: 1em;
    }
    .brand-strip {
      margin: 8px 6vw 64px;
      padding: 28px;
      border: 1px dashed var(--line);
      border-radius: 18px;
      background: rgba(255,252,247,0.55);
    }
    .brand-strip h2 { margin: 0 0 6px; font-size: 20px; font-weight: 500; }
    .brand-strip > p { margin: 0 0 18px; color: var(--muted); font-size: 15px; }
    .brand-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 14px;
    }
    .page-head {
      padding: 40px 6vw 8px;
      max-width: 720px;
    }
    .page-head .back {
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      display: inline-block;
      margin-bottom: 16px;
    }
    .page-head .back:hover { color: var(--ink); }
    .page-head h1 {
      margin: 0;
      font-size: clamp(30px, 5vw, 44px);
      font-weight: 500;
      letter-spacing: -0.01em;
    }
    .page-head .meta {
      margin: 10px 0 0;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: 13px;
      color: var(--muted);
      letter-spacing: 0.06em;
    }

    a.thumb { display: block; color: inherit; }
    .body h3 a:hover { text-decoration: underline; }
    .ship-hint {
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: 11px;
      color: var(--muted);
      margin: 8px 0 0;
      line-height: 1.4;
    }

    footer {
      border-top: 1px solid var(--line);
      padding: 28px 6vw 48px;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: 13px;
      color: var(--muted);
    }

  </style>
</head>
<body>
  <header>
    <a class="brand" href="index.html">
      <svg viewBox="0 0 80 72" fill="none" stroke="#2a2724" stroke-width="2.4" stroke-linejoin="round" aria-hidden="true">
        <path d="M8 34 L40 8 L72 34 V66 H8 Z"/>
        <rect x="18" y="38" width="5" height="5"/><rect x="25" y="38" width="5" height="5"/>
        <rect x="18" y="45" width="5" height="5"/><rect x="25" y="45" width="5" height="5"/>
        <path d="M48 66 V50 H64"/>
      </svg>
      NORTHROOM
    </a>
    <nav>
      <a href="index.html#shop">Shop</a>
      <a href="category.html?cat=Textile">Textile</a>
      <a href="category.html?cat=Lighting">Lighting</a>
      <a href="category.html?cat=Kitchen">Kitchen</a>
      <a href="category.html?cat=Decor">Decor</a>
      <a href="category.html?cat=Bath">Bath</a>
      <a href="category.html?cat=Storage">Storage</a>
      <a href="category.html?cat=Outdoor">Outdoor</a>
      <a href="index.html#mark">Mark</a>
    </nav>
  </header>

  <section class="page-head">
    <a class="back" href="index.html#shop">← Back to Shop</a>
    <h1 id="cat-title">Category</h1>
    <p class="meta" id="cat-meta"></p>
  </section>

  <section class="grid" id="catalog"></section>

  <footer>
    <p>Northroom · Secure checkout · Ships in the US</p>
    <p>Questions? albazirafal859@gmail.com</p>
  </footer>

  <script src="product-images.js"></script>
  <script src="product-images-fixes.js"></script>
  <script src="products.js"></script>
  <script src="catalog-extra.js"></script>
  <script src="prices.js"></script>
  <script>

    const API = "https://smart-store-service.onrender.com/approve_product";
    const WAKE = "https://smart-store-service.onrender.com/";

    function card(p) {
      const esc = (s) => String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/"/g, "&quot;");
      const href = `product.html?title=${encodeURIComponent(p.title)}`;
      const thumb = p.image
        ? `<img src="${esc(p.image)}" alt="${esc(p.title)}" loading="lazy" /><span class="cat">${esc(p.cat)}</span>`
        : `<span class="cat">${esc(p.cat)}</span>`;
      return `<article class="card">
        <a class="thumb" href="${href}">${thumb}</a>
        <div class="body">
          <h3><a href="${href}">${esc(p.title)}</a></h3>
          <p class="price">$${Number(p.price).toFixed(2)}</p>
          <p>${esc(p.blurb)}</p>
          <button class="buy" data-title="${esc(p.title)}">Buy</button>
          <p class="ship-hint">Usually 3–8 days (US stock) or 1–3 weeks (China).</p>
          <p class="note" hidden></p>
        </div>
      </article>`;
    }

    fetch(WAKE, { mode: "cors" }).catch(() => {});

    document.body.addEventListener("click", async (e) => {
      const btn = e.target.closest("button.buy");
      if (!btn) return;
      const note = btn.parentElement.querySelector(".note");
      btn.disabled = true;
      note.hidden = false;
      note.textContent = "Opening checkout…";
      try {
        const res = await fetch(API, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ title: btn.dataset.title })
        });
        const data = await res.json();
        if (data.checkout_url && data.checkout_url.includes("checkout.stripe.com")) {
          window.location = data.checkout_url;
          return;
        }
        note.textContent = "Checkout isn’t ready for this item yet.";
      } catch (err) {
        note.textContent = "Couldn’t reach checkout. Try once more.";
      }
      btn.disabled = false;
    });

    const products = (window.NORTHROOM_PRODUCTS || []).map((p) => {
      const img = (window.NORTHROOM_IMAGES || {})[p.title];
      return img ? Object.assign({}, p, { image: img }) : p;
    });
    const known = (window.NORTHROOM_CATEGORIES || []).map((c) => c.id);
    const params = new URLSearchParams(window.location.search);
    const cat = params.get("cat");

    if (!cat || !known.includes(cat)) {
      window.location.replace("index.html");
    } else {
      const items = products.filter((p) => p.cat === cat);
      document.title = "Northroom — " + cat;
      document.getElementById("cat-title").textContent = cat;
      document.getElementById("cat-meta").textContent = items.length + " pieces";
      document.getElementById("catalog").innerHTML = items.map(card).join("");
    }
  </script>
</body>
</html>
